<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="MGB Dashboard - quick links to Travel Order, Diamond and DTR (online & offline)" />
  <title>MGB Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png" />
  <meta name="application-name" content="MGB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MGB" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <div class="brand-text">
        <h1>MGB Dashboard</h1>
        <p id="brandSub">Tap an icon to jump straight to the app</p>
      </div>
    </div>

    <div class="topbar-actions">
      <time id="clock" class="clock" aria-label="Current time">--:--:--</time>
      <button id="refreshBtn" class="icon-btn" type="button" title="Check link status" aria-label="Check link status">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button id="adminBtn" class="icon-btn" type="button" title="Super Admin" aria-label="Super Admin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section id="grid" class="grid" aria-label="Applications"></section>
  </main>

  <div id="adminModal" class="modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <header class="modal-head">
        <h2 id="adminTitle">Super Admin</h2>
        <button id="adminClose" class="icon-btn" type="button" aria-label="Close">&times;</button>
      </header>
      <div id="adminLogin" class="admin-view">
        <p class="admin-hint">Enter the admin password to manage systems.</p>
        <div class="admin-row">
          <input id="adminPass" type="password" placeholder="Password" autocomplete="current-password" />
          <button id="adminUnlock" class="admin-btn" type="button">Unlock</button>
        </div>
        <p id="adminLoginMsg" class="admin-msg"></p>
      </div>
      <div id="adminPanel" class="admin-view" hidden>
        <section class="admin-section">
          <h3>Manage systems</h3>
          <form id="svcForm" class="admin-form">
            <input type="hidden" id="svcEditId" />
            <div class="admin-grid">
              <label>Title<input id="svcTitle" required placeholder="e.g. New System" /></label>
              <label>Subtitle<input id="svcSub" placeholder="Short description" /></label>
              <label>Online URL<input id="svcOnline" required placeholder="http://..." /></label>
              <label>Offline URL<input id="svcOffline" placeholder="http://..." /></label>
              <label>Icon (SVG)
                <select id="svcIconPreset">
                  <option value="link">Link</option>
                  <option value="clock">Clock</option>
                  <option value="diamond">Diamond</option>
                  <option value="server">Server</option>
                  <option value="user">User</option>
                  <option value="custom">Custom SVG</option>
                </select>
              </label>
            </div>
            <textarea id="svcIconCustom" class="admin-textarea" placeholder="Paste full <svg>...</svg> or image data URL (only if Custom selected)" hidden></textarea>
            <div class="admin-row">
              <input id="svcIconFile" type="file" accept="image/*" />
              <span class="admin-hint" style="margin:0">Upload an image to use as icon</span>
            </div>
            <div class="admin-actions">
              <button id="svcSave" class="admin-btn" type="submit">Save system</button>
              <button id="svcCancel" class="admin-btn admin-btn-ghost" type="button" hidden>Cancel edit</button>
            </div>
            <p id="svcMsg" class="admin-msg"></p>
          </form>
        </section>
        <section class="admin-section">
          <h3>Existing systems</h3>
          <div id="svcList" class="admin-list"></div>
        </section>
        <section class="admin-section">
          <h3>Settings</h3>
          <div class="admin-row">
            <input id="newPass" type="password" placeholder="New admin password" />
            <button id="changePass" class="admin-btn" type="button">Change password</button>
          </div>
          <div class="admin-row">
            <button id="resetDefaults" class="admin-btn admin-btn-ghost" type="button">Reset to defaults</button>
          </div>
          <p id="settingsMsg" class="admin-msg"></p>
        </section>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
